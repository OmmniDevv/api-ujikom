services:
  # 1. SERVER DATABASE
  mysql-server:
    image: mysql:8.0-debian
    container_name: MySQL-API
    restart: always
    environment:
      MYSQL_DATABASE: API_ujikom
      MYSQL_USER: api_ujikom
      MYSQL_PASSWORD: api_ujikom123
      MYSQL_ROOT_PASSWORD: passwordroot
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - API-UJIKOM

  # 2. SERVER BACKEND (LARAVEL)
  app-laravel:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: laravel-api
    restart: unless-stopped
    user: "1000:1000"
    working_dir: /var/www
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www
    command: >
      bash -c "
        (command -v composer >/dev/null 2>&1 || curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer) &&
        composer install --no-interaction --no-dev --optimize-autoloader &&
        ([ -f public/build/manifest.json ] || (npm install && npm run build)) &&
        (grep -q '^APP_KEY=base64' .env 2>/dev/null || php artisan key:generate --no-interaction) &&
        php artisan migrate --force &&
        ([ -f storage/app/.seeded ] || (php artisan db:seed --force && touch storage/app/.seeded)) &&
        php artisan storage:link --force 2>/dev/null || true &&
        php artisan config:clear &&
        php artisan cache:clear &&
        php artisan view:clear &&
        php artisan serve --host=0.0.0.0 --port=8000 --no-reload
      "
    depends_on:
      - mysql-server
    environment:
      DB_HOST: mysql-server
      DB_PORT: 3306
      DB_DATABASE: API_ujikom
      DB_USERNAME: api_ujikom
      DB_PASSWORD: api_ujikom123
    networks:
      - API-UJIKOM

  # 3. SERVER UI DATABASE (PHPMYADMIN)
  phpmyadmin:
    image: phpmyadmin
    container_name: PhpMyadmin-API
    restart: always
    environment:
      PMA_HOST: mysql-server
    ports:
      - "8081:80"
    depends_on:
      - mysql-server
    networks:
      - API-UJIKOM

volumes:
  db_data:

networks:
  API-UJIKOM:
    driver: bridge
